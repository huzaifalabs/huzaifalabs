<?xml version="1.0" ?>
<svg xmlns="http://www.w3.org/2000/svg" width="480" height="44" viewBox="0 0 480 44" role="img" aria-label="Full-Stack Developer">
  <defs>
    <linearGradient id="typeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5a0"/>
      <stop offset="100%" stop-color="#00d9f5"/>
    </linearGradient>
    <filter id="cursorGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect x="0" y="0" width="480" height="44" rx="22" fill="#12121a" stroke="#2a2a3e" stroke-width="1"/>
  <circle cx="18" cy="22" r="4" fill="#00f5a0"/>
  <g>
    <set attributeName="opacity" to="0"/>
    <set attributeName="opacity" to="1" begin="0.0s"/>
    <set attributeName="opacity" to="0" begin="3.0s"/>
    <text x="34" y="28" fill="#eaeaff" font-size="13" font-weight="500" text-anchor="start" font-family="'SF Mono',SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace">Full-Stack Developer</text>
  </g>
  <g>
    <set attributeName="opacity" to="0"/>
    <set attributeName="opacity" to="1" begin="3.5s"/>
    <set attributeName="opacity" to="0" begin="6.5s"/>
    <text x="34" y="28" fill="#eaeaff" font-size="13" font-weight="500" text-anchor="start" font-family="'SF Mono',SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace">Open Source Contributor</text>
  </g>
  <g>
    <set attributeName="opacity" to="0"/>
    <set attributeName="opacity" to="1" begin="7.0s"/>
    <set attributeName="opacity" to="0" begin="10.0s"/>
    <text x="34" y="28" fill="#eaeaff" font-size="13" font-weight="500" text-anchor="start" font-family="'SF Mono',SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace">Python &amp; JavaScript</text>
  </g>
  <g filter="url(#cursorGlow)">
    <rect x="220.39999999999998" y="13" width="2" height="18" rx="1" fill="#00f5a0">
      <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
