<?xml version="1.0" ?>
<svg xmlns="http://www.w3.org/2000/svg" width="580" height="165" viewBox="0 0 580 165" role="img" aria-label="GitHub statistics">
  <defs>
    <linearGradient id="statGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5a0"/>
      <stop offset="50%" stop-color="#00d9f5"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="statGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="valGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect x="0" y="0" width="580" height="165" rx="14" fill="#12121a" stroke="#2a2a3e" stroke-width="1"/>
  <rect x="1" y="1" width="578" height="3" rx="14" fill="url(#statGrad)"/>
  <text x="24" y="38" fill="#8888aa" font-size="11" font-weight="700" text-anchor="start" font-family="'SF Mono',SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace">GITHUB STATS</text>
  <rect x="24" y="55" width="122" height="85" rx="10" fill="#0a0a0f" stroke="#2a2a3e" stroke-width="0.5"/>
  <rect x="25" y="56" width="120" height="3" rx="10" fill="#00f5a0" opacity="0.7"/>
  <g filter="url(#valGlow)">
    <text x="85" y="100" fill="#00f5a0" font-size="28" font-weight="700" text-anchor="middle" font-family="'-apple-system',BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">1</text>
  </g>
  <text x="85" y="122" fill="#8888aa" font-size="10" font-weight="500" text-anchor="middle" font-family="'SF Mono',SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace">Repositories</text>
  <rect x="160" y="55" width="122" height="85" rx="10" fill="#0a0a0f" stroke="#2a2a3e" stroke-width="0.5"/>
  <rect x="161" y="56" width="120" height="3" rx="10" fill="#00d9f5" opacity="0.7"/>
  <g filter="url(#valGlow)">
    <text x="221" y="100" fill="#00d9f5" font-size="28" font-weight="700" text-anchor="middle" font-family="'-apple-system',BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">0</text>
  </g>
  <text x="221" y="122" fill="#8888aa" font-size="10" font-weight="500" text-anchor="middle" font-family="'SF Mono',SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace">Stars</text>
  <rect x="296" y="55" width="122" height="85" rx="10" fill="#0a0a0f" stroke="#2a2a3e" stroke-width="0.5"/>
  <rect x="297" y="56" width="120" height="3" rx="10" fill="#a855f7" opacity="0.7"/>
  <g filter="url(#valGlow)">
    <text x="357" y="100" fill="#a855f7" font-size="28" font-weight="700" text-anchor="middle" font-family="'-apple-system',BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">0</text>
  </g>
  <text x="357" y="122" fill="#8888aa" font-size="10" font-weight="500" text-anchor="middle" font-family="'SF Mono',SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace">Followers</text>
  <rect x="432" y="55" width="122" height="85" rx="10" fill="#0a0a0f" stroke="#2a2a3e" stroke-width="0.5"/>
  <rect x="433" y="56" width="120" height="3" rx="10" fill="#f472b6" opacity="0.7"/>
  <g filter="url(#valGlow)">
    <text x="493" y="100" fill="#f472b6" font-size="28" font-weight="700" text-anchor="middle" font-family="'-apple-system',BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">0</text>
  </g>
  <text x="493" y="122" fill="#8888aa" font-size="10" font-weight="500" text-anchor="middle" font-family="'SF Mono',SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace">Following</text>
</svg>
