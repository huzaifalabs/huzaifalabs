# ────────────────────────────────────────────────
# Auto-update GitHub Profile Dashboard
# Runs daily at 06:00 UTC
# ────────────────────────────────────────────────

name: Update Profile Dashboard

on:
  schedule:
    - cron: '0 6 * * *'   # daily at 06:00 UTC
  workflow_dispatch:        # allow manual trigger

permissions:
  contents: write           # to commit updated assets + README

jobs:
  update:
    name: Fetch data & regenerate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --quiet --upgrade pip

      - name: Fetch GitHub data & generate assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_profile.py

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet README.md assets/ 2>/dev/null; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes detected."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Changes detected in README.md or assets/."
          fi

      - name: Commit & push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md assets/
          git commit -m "chore: update profile dashboard [skip ci]"
          git push
